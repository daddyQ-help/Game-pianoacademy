*{box-sizing:border-box}html,body{margin:0;background:#f7e8c6;font-family:ui-rounded,"Apple SD Gothic Neo",sans-serif;overflow:hidden}button{font:inherit}.game{height:100dvh;display:flex;flex-direction:column}.hud{height:56px;flex:none;background:#fff0c9;border-bottom:4px solid #7d5438;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;color:#5a3928}.logo{font-weight:900;letter-spacing:.04em}.chips{display:flex;gap:7px}.chip{background:#fff9e8;border:3px solid #7d5438;border-radius:9px;padding:5px 8px;font-weight:800;font-size:12px}.viewport{position:relative;flex:1;overflow:hidden;background:#82c971;touch-action:none}.world{position:absolute;width:1800px;height:1120px;transform-origin:0 0;background:#82c971;image-rendering:pixelated}.path{position:absolute;background:#e4b86e;border:6px solid #bd8a52}.path.h{left:0;top:470px;width:1800px;height:190px}.path.v{left:1190px;top:0;width:210px;height:1120px}.path.p2{left:480px;top:250px;width:160px;height:360px}.water{position:absolute;left:720px;top:720px;width:330px;height:230px;border:8px solid #6d9d8c;border-radius:45% 55% 48% 52%;background:repeating-linear-gradient(0deg,#72c5cf 0 18px,#8bd5d5 18px 32px)}.building{position:absolute;text-align:center;color:#563a2c;font-weight:900}.building .box{border:8px solid #754d36;border-radius:10px;background:#ffd28b;box-shadow:inset 0 -18px #e7a85c;font-size:55px;display:grid;place-items:center}.building small{display:block;background:#fff4cf;border:4px solid #754d36;border-radius:6px;padding:3px 7px;margin-top:3px;font-weight:900}.home{left:95px;top:165px}.home .box{width:170px;height:135px}.shop{left:515px;top:90px}.shop .box{width:185px;height:145px;background:#f7a3a8}.bakery{left:875px;top:165px}.bakery .box{width:185px;height:140px;background:#ffd07d}.academy{left:1485px;top:125px}.academy .box{width:225px;height:180px;background:#d99cc8}.forest{position:absolute;left:80px;top:745px;width:470px;height:285px;border:8px solid #477a48;border-radius :#ffe6a3;color:#65412d;font-weight:1000;box-shadow:0 4px 0 #9c6846}.controls button:active,.talk:active{transform:translateY(3px);box-shadow:0 1px 0 #9c6846}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.talk{position:absolute;right:18px;bottom:28px;z-index:20;width:70px;height:70px;border-radius:50%;font-size:22px}.hint{position:absolute;right:13px;top:12px;z-index:20;background:#fff4c9;border:4px solid #79513a;border-radius:9px;padding:6px 9px;color:#60402f;font-weight:900;font-size:12px}.quest{position:absolute;left:13px;top:12px;z-index:20;background:#fff4c9;border:4px solid #79513a;border-radius:9px;padding:6px 9px;color:#60402f;font-weight:900;font-size:12px}.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:40;background:#fff7d4;border:5px solid #704a34;border-radius:12px;padding:10px 14px;font-weight:900;color:#5d3b29;display:none}.toast.show{display:block}@media(max-width:600px){.hud{height:50px}.logo{font-size:14px}.chip{font-size:10px;padding:4px 6px}.controls{transform:scale(.88);transform-origin:left bottom;left:8px;bottom:8px}.talk{right:10px;bottom:15px;width:62px;height:62px}.hint{font-size:10px}.dialog{bottom:92px}.portrait{width:54px;height:54px;font-size:36px}.text{font-size:14px}}
 .number-entry{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.number-entry input{width:120px;min-height:48px;font-size:24px;font-weight:900;text-align:center;border:4px solid #754d36;border-radius:10px;background:#fff;color:#4e392c}.number-entry button,.pad button{min-height:44px;border:3px solid #754d36;border-radius:8px;background:#ffe8a5;color:#5b3a29;font-weight:900}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:5px;margin-top:8px}.pad button{font-size:20px}.feedback{margin-top:6px;font-size:13px;font-weight:800;color:#81512b}@media(max-width:600px){.dialog{max-height:65%;overflow-y:auto}.pad{grid-template-columns:repeat(3,48px)}} </style></head><body><div class="game"><div class="hud"><div><div class="logo">🎹 PIANO ROAD</div><div style="font-size:11px">피아노 학원 가는 길</div></div><div class="chips"><div class="chip">DAY 1</div><div class="chip">💬 <span id="talkCount">0</span></div></div></div><div class="viewport" id="viewport"><div class="world" id="world">

<button class="npc" data-id="girl" style="left:410px;top:500px"><span class="face">👧🏻</span><span class="bubble">…</span></button><button class="npc" data-id="rabbit" style="left:810px;top:520px"><span class="face">🐰</span><span class="bubble">?</span></button><button class="npc" data-id="squirrel" style="left:1100px;top:500px"><span class="face">🐿️</span><span class="bubble">!</span></button><button class="npc" data-id="cat" style="left:1270px;top:700px"><span class="face">🐱</span></button><button class="npc" data-id="boy" style="left:1510px;top:510px"><span class="face">🧒🏻</span><span class="bubble">♪</span></button>

<div class="quest" id="quest">목표: 피아노 학원으로 가기</div><div class="hint">가까이 가서 A · 화살표/WASD 이동</div><div class="toast" id="toast"></div><div class="controls"><button class="up" data-dx="0" data-dy="-1">▲</button><button class="left" data-dx="-1" data-dy="0">◀</button><button class="down" data-dx="0" data-dy="1">▼</button><button class="right" data-dx="1" data-dy="0">▶</button></div><button class="talk" id="talk">A</button>

<script>
(()=>{
const $=id=>document.getElementById(id), world=$('world'),vp=$('viewport'),player=$('player'),dialog=$('dialog'),portrait=$('portrait'),speaker=$('speaker'),text=$('dialogText'),choices=$('choices'),toast=$('toast'),count=$('talkCount');
let px=245,py=520,locked=false,talks=0,firstQuestion=true,answered=0;const speed=28,autoSeen={},completed={};
const npcs={
 girl:{x:410,y:500,face:'👧🏻',name:'작은 여자아이',auto:false,start:'언니… 나 좀 도와줄래?',options:['무슨 일이야?','괜찮아?'],question:{story:'스티커가 15개 있었는데 친구가 5개를 더 줬어. 지금 스티커는 모두 몇 개일까?',answer:20},reply:'언니 덕분에 알았어! 고마워~'},
 rabbit:{x:810,y:520,face:'🐰',name:'토끼',auto:false,start:'당근을 세다가 헷갈렸어!',options:['내가 도와줄게!','몇 개 있는데?'],question:{story:'당근 24개 중에서 6개를 먹었어. 몇 개 남았을까?',answer:18},reply:'와! 정말 고마워!'},
 squirrel:{x:1100,y:500,face:'🐿️',name:'다람쥐',auto:true,start:'저기! 도토리 계산을 좀 도와줘!',options:['무슨 일이야?','도토리가 몇 개야?'],question:{story:'도토리 37개를 모았는데 12개를 친구에게 주었어. 그 뒤 4개를 더 주웠다면 지금 몇 개일까?',answer:29},reply:'이제 알겠어! 고마워!'},
 cat:{x:1270,y:700,face:'🐱',name:'고양이',auto:false,start:'야옹! 연못이 정말 예쁘지?',options:['응! 예쁘다.','물고기도 있어?'],reply:'야옹~ 오늘도 좋은 하루!'},
 boy:{x:1510,y:510,face:'🧒🏻',name:'피아노 친구',auto:true,start:'너도 피아노 학원 가? 난 조금 어려운 문제가 있어.',options:['같이 풀어볼까?','어떤 문제인데?'],question:{story:'학원에 연필이 46자루 있었어. 18자루를 나누어 주고 7자루를 새로 샀다면 몇 자루가 있을까?',answer:35},reply:'우와, 덕분에 해결했어!'},
 dog:{x:650,y:530,face:'🐶',name:'강아지',auto:false,start:'멍멍! 내 공을 봤니?',options:['같이 찾아보자.','무슨 색 공이야?'],reply:'노란 공이야! 찾아봐 줘서 고마워!'},
 fox:{x:980,y:530,face:'🦊',name:'여우',auto:true,start:'잠깐! 사과를 세는 게 헷갈려.',options:['도와줄게!','사과가 몇 개야?'],question:{story:'사과가 28개 있었는데 17개를 더 받았어. 모두 몇 개가 되었을까?',answer:45},reply:'고마워! 이제 셀 수 있겠어.'},
 duck:{x:780,y:685,face:'🦆',name:'오리',auto:false,start:'꽥! 연못으로 산책 나왔어.',options:['안녕!','물은 시원해?'],reply:'꽥꽥! 정말 시원해.'},
 hedgehog:{x:550,y:685,face:'🦔',name:'고슴도치',auto:false,start:'내가 모은 열매가 몇 개일까?',options:['같이 세자!','어디에 모았어?'],question:{story:'열매 19개에 11개를 더 모았어. 지금 몇 개일까?',answer:30},reply:'맞아! 정말 고마워.'},
 friend:{x:1390,y:510,face:'👧🏽',name:'동네 친구',auto:false,start:'언니! 내 색연필 계산 좀 알려줘.',options:['응, 말해봐!','무슨 색연필이야?'],question:{story:'색연필이 53자루 있었는데 19자루를 친구에게 빌려줬어. 친구가 5자루를 돌려줬다면 지금 몇 자루일까?',answer:39},reply:'와! 덕분에 해결했어!'},
 bear:{x:1570,y:680,face:'🐻',name:'곰',auto:false,start:'안녕! 빵 냄새 좋지?',options:['정말 맛있겠다!','무슨 빵이야?'],reply:'꿀빵이야! 좋은 하루 보내~'},
 bird:{x:1030,y:690,face:'🐦',name:'작은 새',auto:true,start:'짹짹! 노래 부르러 가는 길이야.',options:['어떤 노래야?','같이 불러볼까?'],reply:'짹짹♪ 도레미~ 피아노 잘 치고 와!'}
};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function camera(){const vw=vp.clientWidth,vh=vp.clientHeight;world.style.transform=`translate(${-clamp(px-vw/2+29,0,Math.max(0,1800-vw))}px,${-clamp(py-vh/2+36,0,Math.max(0,1120-vh))}px)`}
function setPlayer(){player.style.left=px+'px';player.style.top=py+'px';camera();checkAuto()}
function collides(nx,ny){return [[75,135,215,185],[495,65,225,190],[855,140,225,190],[1460,95,270,230],[60,720,510,330]].some(([x,y,w,h])=>nx+50>x&&nx<x+w&&ny+65>y&&ny<y+h)}
function move(dx,dy){if(locked)return;const nx=clamp(px+dx*speed,0,1740),ny=clamp(py+dy*speed,0,1040);if(!collides(nx,ny)){px=nx;py=ny;setPlayer()}}
function nearest(){let best=null,dist=1e9;Object.entries(npcs).forEach(([id,n])=>{let d=Math.hypot(px-n.x,py-n.y);if(d<dist){dist=d;best=id}});return dist<115?best:null}
function say(n,msg){locked=true;dialog.classList.add('show');portrait.textContent=n.face;speaker.textContent=n.name;text.textContent=msg;choices.innerHTML=''}
function button(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',fn);choices.appendChild(b);return b}
function closeDialog(){dialog.classList.remove('show');locked=false}
function inputQuestion(n,q){say(n,q.story);const wrap=document.createElement('div');wrap.className='number-entry';const inp=document.createElement('input');inp.type='text';inp.inputMode='numeric';inp.pattern='[0-9]*';inp.maxLength=3;inp.placeholder='?';inp.setAttribute('aria-label','정답 숫자 입력');wrap.appendChild(inp);const confirm=document.createElement('button');confirm.type='button';confirm.textContent='확인 ✓';wrap.appendChild(confirm);choices.appendChild(wrap);const pad=document.createElement('div');pad.className='pad';choices.appendChild(pad);for(const v of ['1','2','3','4','5','6','7','8','9','←','0','지우기']){const b=document.createElement('button');b.type='button';b.textContent=v;b.addEventListener('click',()=>{if(v==='←')inp.value=inp.value.slice(0,-1);else if(v==='지우기')inp.value='';else if(inp.value.length<3)inp.value+=v});pad.appendChild(b)}
 const feedback=document.createElement('div');feedback.className='feedback';choices.appendChild(feedback);const check=()=>{const val=inp.value.trim();if(!/^\d{1,3}$/.test(val)){feedback.textContent='숫자를 적어줘~';return}if(Number(val)===q.answer){answered++;completed[Object.keys(npcs).find(k=>npcs[k]===n)]=true;say(n,n.reply+' 🌟 정답이야!');button('고마워! 계속 가기',closeDialog)}else{feedback.textContent='잉, 조금 다르네! 괜찮아~ 다음에 다시 잘 알려줘! 💛';inp.value=''}};confirm.addEventListener('click',check);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});}
function talk(id){if(locked)return;const n=npcs[id];talks++;count.textContent=talks;say(n,n.start);if(completed[id]){text.textContent='아까 도와줘서 고마워! 또 만나자~';button('안녕!',closeDialog);return}n.options.slice(0,3).forEach((label,i)=>button(label,()=>{if(n.question){const q=firstQuestion?{story:'사과가 15개 있었는데 5개를 더 받았어. 모두 몇 개일까?',answer:20}:n.question;firstQuestion=false;inputQuestion(n,q)}else{say(n,n.reply);button('안녕!',closeDialog)}}))}
function checkAuto(){Object.entries(npcs).forEach(([id,n])=>{if(n.auto&&!autoSeen[id]&&Math.hypot(px-n.x,py-n.y)<125&&!locked){autoSeen[id]=true;talk(id)}})}
function flash(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
document.querySelectorAll('.controls button').forEach(b=>b.addEventListener('click',()=>move(+b.dataset.dx,+b.dataset.dy)));$('talk').addEventListener('click',()=>{if(locked)return;const id=nearest();id?talk(id):flash('조금 더 가까이 가보자!')});document.querySelectorAll('.npc').forEach(b=>b.addEventListener('click',()=>{if(locked)return;const id=b.dataset.id,n=npcs[id];Math.hypot(px-n.x,py-n.y)<135?talk(id):flash('가까이 가서 말을 걸어보자!')}));window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(locked){if(e.key==='Escape')closeDialog();return}const k={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};if(k[e.key]){e.preventDefault();move(...k[e.key])}else if(e.key==='Enter'||e.key===' '){const id=nearest();id?talk(id):flash('주변에 이야기할 친구가 없어!')}});window.addEventListener('resize',camera);setPlayer();setTimeout(()=>{say({face:'👩🏻',name:'엄마'},'피아노 학원 잘 다녀와! 친구들을 만나면 인사도 해보렴.');button('응! 다녀올게!',closeDialog);button('엄마, 이따 봐!',closeDialog)},350);
})();
