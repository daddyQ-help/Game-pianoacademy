<script>
(()=>{
const $=id=>document.getElementById(id), world=$('world'),vp=$('viewport'),player=$('player'),dialog=$('dialog'),portrait=$('portrait'),speaker=$('speaker'),text=$('dialogText'),choices=$('choices'),toast=$('toast'),count=$('talkCount');
let px=245,py=520,locked=false,talks=0,firstQuestion=true,answered=0;const speed=28,autoSeen={},completed={}; const questionModes={}; let questionModeCount=0;
let bonusReady=false,bonusActive=false,bonusWon=false,pet=null;
const pets=[['rabbit','🐰','토끼'],['squirrel','🐿️','다람쥐'],['cat','🐱','고양이'],['dog','🐶','강아지']];
try{pet=localStorage.getItem('pianoRoadPet')||null}catch(e){}
let trail=[];const companion=$('companion');
function updatePet(){if(!pet){companion.style.display='none';return}const found=pets.find(a=>a[0]===pet);if(!found)return;companion.textContent='';companion.style.display='block';const at=trail[Math.max(0,trail.length-5)]||{x:px-55,y:py+12};companion.style.left=at.x+'px';companion.style.top=at.y+'px'}
function choosePet(){bonusActive=false;bonusWon=true;say({face:'🐿️',name:'다람쥐'},'우와! 정답이야! 이제 어떤 동물 친구와 함께 갈래?');pets.forEach(([id,emoji,name])=>{const b=button(emoji+' '+name,()=>{pet=id;try{localStorage.setItem('pianoRoadPet',id)}catch(e){};trail=[{x:px-55,y:py+12}];updatePet();say({face:emoji,name:name},'야호! 이제부터 내가 뒤를 따라갈게! 💛');button('함께 출발!',closeDialog)});b.classList.add('pet-card')})}
function bonusQuestion(){bonusActive=true;const n={face:'🐿️',name:'특별한 다람쥐'};let tries=0;
 function show(hint=''){say(n,'특별한 문제! 도토리 10개가 있어. 3개를 친구에게 주면 몇 개가 남을까?');const inp=document.createElement('input');inp.type='text';inp.inputMode='numeric';inp.maxLength=3;inp.placeholder='정답';inp.setAttribute('aria-label','보너스 문제 답');inp.style.cssText='width:100px;height:48px;flex:none;font-size:22px;padding:8px;border:3px solid #754d36;border-radius:8px';choices.appendChild(inp);const pad=document.createElement('div');pad.className='pad';choices.appendChild(pad);for(const v of ['1','2','3','4','5','6','7','8','9','←','0','지우기']){const b=document.createElement('button');b.textContent=v;b.type='button';b.addEventListener('click',()=>{if(v==='←')inp.value=inp.value.slice(0,-1);else if(v==='지우기')inp.value='';else if(inp.value.length<3)inp.value+=v});pad.appendChild(b)}
 const feedback=document.createElement('div');feedback.className='feedback';feedback.textContent=hint;choices.appendChild(feedback);

function squirrelVisit(){if(bonusWon||bonusActive||!bonusReady||locked)return;bonusReady=false;bonusActive=true;say({face:'🐿️',name:'다람쥐'},'언니~! 문제를 세 개나 맞혔다며? 🐿️ 특별한 문제를 맞히면 좋아하는 동물 친구가 따라다닐 거야!');button('도전할래!',bonusQuestion);button('조금 있다가!',()=>{bonusActive=false;bonusReady=true;closeDialog()})}

const fruitNames=['도토리','당근','사과','밤','딸기','귤'];
function fruitQuestion(){
 const kinds=[...fruitNames].sort(()=>Math.random()-.5).slice(0,3);
 const mode=Math.floor(Math.random()*3);
 // 1학년 2학기: 한 번에 계산할 묶음은 하나만, 나머지는 바로 읽을 수 있는 수
 if(mode===0){
  const ones=1+Math.floor(Math.random()*9),b=2+Math.floor(Math.random()*7),c=1+Math.floor(Math.random()*5);
  return {story:`${kinds[0]}는 10개 묶음 1개와 낱개 ${ones}개가 있어. ${kinds[1]}는 ${b}개, ${kinds[2]}는 ${c}개야. ${kinds[0]}는 모두 몇 개일까?`,answer:10+ones};
 }
 const nums=[11+Math.floor(Math.random()*7),3+Math.floor(Math.random()*6),8+Math.floor(Math.random()*3)];
 // 동점 방지
 if(nums[1]===nums[2])nums[2]++;
 const intro=kinds.map((name,i)=>`${name} ${nums[i]}개`).join(', ');
 if(mode===1)return {story:`${intro}가 있어. 가장 많은 것은 몇 개일까?`,answer:Math.max(...nums)};
 return {story:`${intro}가 있어. 가장 적은 것은 몇 개일까?`,answer:Math.min(...nums)};
}
function basicQuestion(){
 const a=Math.floor(Math.random()*21),plus=Math.random()<.5;
 if(plus){const b=Math.floor(Math.random()*(21-a));return {story:`${a}개의 색연필이 있었어. 친구가 ${b}개를 더 주었어. 모두 몇 개일까?`,answer:a+b}}
 const b=Math.floor(Math.random()*(a+1));return {story:`${a}개의 스티커가 있었는데 ${b}개를 나눠줬어. 몇 개가 남을까?`,answer:a-b};
}
function questionFor(n){return Math.random()<.25?fruitQuestion():basicQuestion()}
const npcs={
 girl:{x:410,y:500,face:'👧🏻',name:'작은 여자아이',auto:false,start:'언니… 나 좀 도와줄래?',options:['무슨 일이야?','괜찮아?'],question:{story:'스티커가 15개 있었는데 친구가 5개를 더 줬어. 지금 스티커는 모두 몇 개일까?',answer:20},reply:'언니 덕분에 알았어! 고마워~'},

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function camera(){const vw=vp.clientWidth,vh=vp.clientHeight;world.style.transform=`translate(${-clamp(px-vw/2+29,0,Math.max(0,1800-vw))}px,${-clamp(py-vh/2+36,0,Math.max(0,1120-vh))}px)`}
function setPlayer(){player.style.left=px+'px';player.style.top=py+'px';trail.push({x:px,y:py});if(trail.length>15)trail.shift();updatePet();camera();checkAuto()}
function collides(nx,ny){return [[75,135,215,185],[495,65,225,190],[855,140,225,190],[1460,95,270,230],[60,720,510,330],[565,790,200,190],[780,790,200,190],[995,790,200,190],[1210,790,200,190],[1425,790,200,190]].some(([x,y,w,h])=>nx+50>x&&nx<x+w&&ny+65>y&&ny<y+h)}
function move(dx,dy){if(locked)return;heroDir=dy<0?'back':'front';heroMovingUntil=Date.now()+280;const nx=clamp(px+dx*speed,0,1740),ny=clamp(py+dy*speed,0,1040);if(!collides(nx,ny)){px=nx;py=ny;setPlayer()}}
function nearest(){let best=null,dist=1e9;Object.entries(npcs).forEach(([id,n])=>{let d=Math.hypot(px-n.x,py-n.y);if(d<dist){dist=d;best=id}});return dist<115?best:null}
function say(n,msg){locked=true;dialog.classList.add('show');portrait.textContent='';const ptype=({'🐰':'rabbit0','🐿️':'squirrel0','🐱':'cat0','🐶':'dog0',})[n.face];portrait.style.backgroundImage=ptype?`url('./${ptype}.png')`:'';if(!ptype)portrait.textContent=n.face;speaker.textContent=n.name;text.textContent=msg;choices.innerHTML=''}
function button(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',fn);choices.appendChild(b);return b}
function closeDialog(){dialog.classList.remove('show');locked=false;afterDialog()}
function modeFor(id){if(!questionModes[id]){questionModeCount++;questionModes[id]=(questionModeCount%4===0)?'required':'optional';}return questionModes[id]}
function inputQuestion(n,q){
 const id=Object.keys(npcs).find(k=>npcs[k]===n),required=modeFor(id)==='required';
 let wrongAttempts=0;
 function render(hint=''){
  say(n,(required?'⭐ 꼭 해결해야 하는 부탁!\n':'')+q.story);
  const wrap=document.createElement('div');wrap.className='number-entry';
  const inp=document.createElement('input');inp.type='text';inp.inputMode='numeric';inp.pattern='[0-9]*';inp.maxLength=3;inp.placeholder='?';inp.setAttribute('aria-label','정답 숫자 입력');wrap.appendChild(inp);
  const confirm=document.createElement('button');confirm.type='button';confirm.textContent='확인 ✓';wrap.appendChild(confirm);choices.appendChild(wrap);
  const pad=document.createElement('div');pad.className='pad';choices.appendChild(pad);
  for(const v of ['1','2','3','4','5','6','7','8','9','←','0','지우기']){const b=document.createElement('button');b.type='button';b.textContent=v;b.addEventListener('click',()=>{if(v==='←')inp.value=inp.value.slice(0,-1);else if(v==='지우기')inp.value='';else if(inp.value.length<3)inp.value+=v});pad.appendChild(b)}
  const feedback=document.createElement('div');feedback.className='feedback';feedback.textContent=hint;choices.appendChild(feedback);
  const check=()=>{const val=inp.value.trim();if(!/^\d{1,3}$/.test(val)){feedback.textContent='숫자를 적어줘~';return}
   if(Number(val)===q.answer){answered++;completed[id]=true;say(n,n.reply+' 🌟 정답이야!');button('고마워! 계속 가기',closeDialog);return}
   wrongAttempts++;inp.value='';
   if(wrongAttempts===1){feedback.textContent='앗, 조금 다르네! 괜찮아~ 한 번만 더 생각해 볼까? 💛';return}
   if(!required){say(n,'잉, 이번에도 조금 달랐네! 그래도 두 번이나 도전하다니 멋져! 다음에 다시 잘 알려줘~ 💛');setTimeout(()=>{if(dialog.classList.contains('show')&&speaker.textContent===n.name)closeDialog()},2300);return}
   say(n,'두 번이나 도전했구나! 정말 멋져! 💛 이 부탁은 함께 꼭 해결해보자. 힌트를 보고 다시 해볼까?');
   button('힌트 보고 다시 풀기',()=>render('💡 천천히 생각해봐! 답은 0부터 30 사이야. 필요한 만큼 다시 도전해도 돼.'));
   button('잠깐 쉬었다 올게',closeDialog);
  };
  confirm.addEventListener('click',check);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
 }
 render();
}
function talk(id){if(locked)return;const n=npcs[id];talks++;count.textContent=talks;say(n,n.start);if(completed[id]){text.textContent='아까 도와줘서 고마워! 또 만나자~';button('안녕!',closeDialog);return}n.options.slice(0,3).forEach((label,i)=>button(label,()=>{if(n.question){const q=firstQuestion?{story:'사과가 8개 있었는데 5개를 더 받았어. 모두 몇 개일까?',answer:13}:questionFor(n);firstQuestion=false;inputQuestion(n,q)}else{say(n,n.reply);button('안녕!',closeDialog)}}))}
function checkAuto(){Object.entries(npcs).forEach(([id,n])=>{if(n.auto&&!autoSeen[id]&&Math.hypot(px-n.x,py-n.y)<125&&!locked){autoSeen[id]=true;talk(id)}})}
function flash(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
document.querySelectorAll('.controls button').forEach(b=>b.addEventListener('click',()=>move(+b.dataset.dx,+b.dataset.dy)));$('talk').addEventListener('click',()=>{if(locked)return;const id=nearest();if(bonusReady&&!pet)squirrelVisit();else id?talk(id):flash('조금 더 가까이 가보자!')});document.querySelectorAll('.npc').forEach(b=>b.addEventListener('click',()=>{if(locked)return;const id=b.dataset.id,n=npcs[id];Math.hypot(px-n.x,py-n.y)<135?talk(id):flash('가까이 가서 말을 걸어보자!')}));window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(locked){if(e.key==='Escape')closeDialog();return}const k={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};if(k[e.key]){e.preventDefault();move(...k[e.key])}else if(e.key==='Enter'||e.key===' '){const id=nearest();id?talk(id):flash('주변에 이야기할 친구가 없어!')}});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{if(e.target.closest('input,textarea'))return;const now=Date.now();if(now-lastTouch<300)e.preventDefault();lastTouch=now},{passive:false});

const spriteTypes={rabbit:'rabbit',squirrel:'squirrel',cat:'cat',dog:'dog',};
let heroDir='front',heroMovingUntil=0,frameIndex=0;
function spriteTick(){frameIndex++;const moving=Date.now()<heroMovingUntil;
 const heroFrame=moving?'hero_walk'+(frameIndex%4):(heroDir==='back'?'hero_back':'hero_front');
 const hface=player.querySelector('.face');if(hface)hface.style.backgroundImage="url('./"+heroFrame+".png')";
 document.querySelectorAll('.npc').forEach((el,i)=>{const type=spriteTypes[el.dataset.id];if(!type)return;const frame=type+Math.floor((frameIndex+i*2)/3)%4;el.querySelector('.face').style.backgroundImage="url('./"+frame+".png')"});
 if(pet){const type=pets.find(x=>x[0]===pet)?.[0];if(type)companion.style.backgroundImage="url('./"+type+(frameIndex%4)+".png')"}
}
setInterval(spriteTick,165);spriteTick();
window.addEventListener('resize',camera);setPlayer();setTimeout(()=>{say({face:'👩🏻',name:'엄마'},'피아노 학원 잘 다녀와! 친구들을 만나면 인사도 해보렴.');button('응! 다녀올게!',closeDialog);button('엄마, 이따 봐!',closeDialog)},350);
})();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(async reg=>{try{await reg.update()}catch(e){} }).catch(err=>console.warn('Offline setup:',err))})}</script></body></html>
