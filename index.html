let audioCtx=null,musicTimer=null,musicOn=false,musicStep=0;
const melody=[60,64,67,72,69,67,64,60,62,65,69,72,67,65,62,60];
function note(freq,duration,volume){
 const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type='sine';osc.frequency.value=freq;
 gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(volume,audioCtx.currentTime+.03);
 gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
 osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration+.02);
}
function musicBeat(){
 if(!audioCtx||audioCtx.state!=='running')return;
 const midi=melody[musicStep%melody.length];note(440*Math.pow(2,(midi-69)/12),.7,.025);
 if(musicStep%4===0)note(440*Math.pow(2,(midi-81)/12),1.5,.012);
 musicStep++;
}
$('musicToggle').addEventListener('click',async()=>{

});

 // 1학년 2학기: 한 번에 계산할 묶음은 하나만, 나머지는 바로 읽을 수 있는 수

  const ones=1+Math.floor(Math.random()*9),b=2+Math.floor(Math.random()*7),c=1+Math.floor(Math.random()*5);
  return {story:`${kinds[0]}는 10개 묶음 1개와 낱개 ${ones}개가 있어. ${kinds[1]}는 ${b}개, ${kinds[2]}는 ${c}개야. ${kinds[0]}는 모두 몇 개일까?`,answer:10+ones};
 }
 const nums=[11+Math.floor(Math.random()*7),3+Math.floor(Math.random()*6),8+Math.floor(Math.random()*3)];
 // 동점 방지
 if(nums[1]===nums[2])nums[2]++;
 const intro=kinds.map((name,i)=>`${name} ${nums[i]}개`).join(', ');
 if(mode===1)return {story:`${intro}가 있어. 가장 많은 것은 몇 개일까?`,answer:Math.max(...nums)};

}

function distSegment(x,y,a,b){
 const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1)));

}

  const feedback=document.createElement('div');feedback.className='feedback';feedback.textContent=hint;choices.appendChild(feedback);
  const check=()=>{const val=inp.value.trim();if(!/^\d{1,3}$/.test(val)){feedback.textContent='숫자를 적어줘~';return}
   if(Number(val)===q.answer){answered++;if(answered%3===0&&answered<=12)setTimeout(()=>{if(!locked)couponAward();else window.pendingCoupon=true},700);completed[id]=true;say(n,n.reply+' 🌟 정답이야!');button('고마워! 계속 가기',closeDialog);return}
   wrongAttempts++;inp.value='';
   if(wrongAttempts===1){feedback.textContent='앗, 조금 다르네! 괜찮아~ 한 번만 더 생각해 볼까? 💛';return}
   if(!required){say(n,'잉, 이번에도 조금 달랐네! 그래도 두 번이나 도전하다니 멋져! 다음에 다시 잘 알려줘~ 💛');setTimeout(()=>{if(dialog.classList.contains('show')&&speaker.textContent===n.name)closeDialog()},2300);return}
   say(n,'두 번이나 도전했구나! 정말 멋져! 💛 이 부탁은 함께 꼭 해결해보자. 힌트를 보고 다시 해볼까?');
   button('힌트 보고 다시 풀기',()=>render('💡 천천히 생각해봐! 답은 0부터 30 사이야. 필요한 만큼 다시 도전해도 돼.'));
   button('잠깐 쉬었다 올게',closeDialog);
  };
  confirm.addEventListener('click',check);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
 }
 render();
}
function talk(id){if(locked)return;const n=npcs[id];talks++;count.textContent=talks;say(n,n.start);if(completed[id]){text.textContent='아까 도와줘서 고마워! 또 만나자~';button('안녕!',closeDialog);return}n.options.slice(0,3).forEach((label,i)=>button(label,()=>{if(n.question){const q=firstQuestion?{story:'사과가 8개 있었는데 5개를 더 받았어. 모두 몇 개일까?',answer:13}:questionFor(n);firstQuestion=false;inputQuestion(n,q)}else{say(n,n.reply);button('안녕!',closeDialog)}}))}
function checkAuto(){Object.entries(npcs).forEach(([id,n])=>{if(n.auto&&!autoSeen[id]&&Math.hypot(px-n.x,py-n.y)<125&&!locked){autoSeen[id]=true;talk(id)}})}
function flash(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
const stick=$('joystick'),knob=$('joystickKnob');
let stickPointer=null,stickX=0,stickY=0;const pressed=new Set();
function resetStick(){stickPointer=null;stickX=stickY=0;knob.style.transform='translate(-50%,-50%)'}
function updateStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const dx=e.clientX-cx,dy=e.clientY-cy,limit=r.width*.31,dist=Math.hypot(dx,dy),ratio=dist>limit?limit/dist:1;
 const vx=dx*ratio,vy=dy*ratio;stickX=vx/limit;stickY=vy/limit;
 knob.style.transform=`translate(calc(-50% + ${vx}px),calc(-50% + ${vy}px))`;
}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);updateStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();updateStick(e)}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{if(e.pointerId===stickPointer)resetStick()});
$('talk').addEventListener('click',()=>{if(locked)return;if(missionCheck())return;const id=nearest();if(bonusReady&&!pet)squirrelVisit();else id?talk(id):flash('조금 더 가까이 가보자!')});
document.querySelectorAll('.npc').forEach(b=>b.addEventListener('click',()=>{if(locked)return;const id=b.dataset.id,n=npcs[id];Math.hypot(px-n.x,py-n.y)<135?talk(id):flash('가까이 가서 말을 걸어보자!')}));
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(locked){if(e.key==='Escape')closeDialog();return}
 const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){e.preventDefault();pressed.add(k)}
 else if(e.key==='Enter'||e.key===' '){e.preventDefault();const id=nearest();id?talk(id):flash('주변에 이야기할 친구가 없어!')}});
window.addEventListener('keyup',e=>pressed.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{pressed.clear();resetStick()});
let prev=performance.now();function frame(now){const dt=Math.min((now-prev)/1000,.05);prev=now;
 if(!locked){let x=stickX,y=stickY;
 if(pressed.has('arrowleft')||pressed.has('a'))x-=1;if(pressed.has('arrowright')||pressed.has('d'))x+=1;
 if(pressed.has('arrowup')||pressed.has('w'))y-=1;if(pressed.has('arrowdown')||pressed.has('s'))y+=1;
 if(Math.hypot(x,y)>.12)move(x,y,dt*170*Math.min(1,Math.hypot(x,y)))}
 requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{if(e.target.closest('input,textarea'))return;const now=Date.now();if(now-lastTouch<300)e.preventDefault();lastTouch=now},{passive:false});

const spriteTypes={rabbit:'rabbit',squirrel:'squirrel',cat:'cat',dog:'dog',};
const hairNames=['긴머리','긴 생머리','단발머리'];
let hairStyle=0,hairDraft=0,hairFirst=false;
try{const saved=localStorage.getItem('pianoRoadHairStyle');if(saved!==null){hairStyle=Math.max(0,Math.min(2,Number(saved)||0));hairFirst=true}}catch(e){}
const hairOverlay=$('hairOverlay'),hairOptions=$('hairOptions');
function renderHairOptions(){hairOptions.innerHTML='';hairNames.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className='hair-option'+(i===hairDraft?' selected':'');const im=document.createElement('img');im.src='./hair'+i+'_thumb.png';im.alt=name;const label=document.createElement('span');label.textContent=name;b.append(im,label);b.addEventListener('click',()=>{hairDraft=i;renderHairOptions()});hairOptions.appendChild(b)})}
function showHair(){hairDraft=hairStyle;renderHairOptions();hairOverlay.classList.add('active');locked=true}
function hideHair(){hairOverlay.classList.remove('active');locked=false}
$('changeHair').addEventListener('click',showHair);$('hairCancel').addEventListener('click',hideHair);
$('hairConfirm').addEventListener('click',()=>{hairStyle=hairDraft;try{localStorage.setItem('pianoRoadHairStyle',String(hairStyle))}catch(e){}hideHair();spriteTick()});
let heroDir='front',heroMovingUntil=0,frameIndex=0;
function spriteTick(){frameIndex++;const moving=Date.now()<heroMovingUntil;
 const heroFrame='hair'+hairStyle+'_'+(moving?'walk'+(frameIndex%4):'front');
 const hface=player.querySelector('.face');if(hface)hface.style.backgroundImage="url('./"+heroFrame+".png')";
 
 if(pet){const type=pets.find(x=>x[0]===pet)?.[0];if(type)companion.style.backgroundImage="url('./"+type+(frameIndex%4)+".png')"}
}
setInterval(spriteTick,165);spriteTick();
window.addEventListener('resize',camera);setPlayer();setTimeout(()=>{say({face:'👩🏻',name:'엄마'},'피아노 학원 잘 다녀와! 친구들을 만나면 인사도 해보렴.');button('응! 다녀올게!',closeDialog);button('엄마, 이따 봐!',closeDialog);if(!hairFirst)setTimeout(showHair,250)},350);
})();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(async reg=>{try{await reg.update()}catch(e){} }).catch(err=>console.warn('Offline setup:',err))})}</script></body></html>
